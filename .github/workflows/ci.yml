name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: 后端编译、集成测试与接口冒烟测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 集成测试（JUnit，30 个用例）
        working-directory: backend
        run: mvn -B verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

      - name: 启动后端（写入演示数据）
        working-directory: backend
        run: |
          nohup java -jar target/study-room-booking-1.0.0.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/api/rules; then echo "后端已启动（${i} 秒）"; exit 0; fi
            sleep 1
          done
          echo "后端 60 秒内未能启动"; cat app.log; exit 1

      - name: 接口冒烟测试
        run: python3 tools/api_smoke.py --base http://localhost:8080/api

      - name: 后端日志
        if: always()
        run: tail -n 80 backend/app.log || true

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
