server:
  port: 8080

spring:
  application:
    name: study-room-booking
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:studyroom}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      # 启动时执行 schema.sql（全部为 CREATE TABLE IF NOT EXISTS，可重复执行）
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# ===== 业务参数：预约规则全部可配置，不写死在代码里 =====
studyroom:
  zone: Asia/Shanghai
  # 首次启动且用户表为空时，写入演示数据（管理员、学生、自习室、历史预约）
  demo-data: true
  scheduling-enabled: true
  jwt:
    # 生产环境请通过环境变量覆盖，长度不少于 32 字节
    secret: ${JWT_SECRET:study-room-booking-demo-secret-key-please-change-me}
    expire-hours: 24
  reserve:
    max-days-ahead: 6             # 可预约今天及之后 6 天
    max-hours-per-reservation: 4  # 单次预约最长时长（小时）
    max-hours-per-day: 8          # 每人每天累计预约上限（小时）
    checkin-early-minutes: 15     # 开始前多少分钟可以签到
    checkin-late-minutes: 15      # 开始后多少分钟内必须签到，超时记爽约
    away-max-minutes: 30          # 单次暂离最长时间
    away-max-times: 2             # 每次预约最多暂离次数
    scan-interval-ms: 30000       # 定时扫描间隔
  credit:
    window-days: 30               # 违约统计窗口
    max-violations: 3             # 窗口内违约达到该次数即禁约
    ban-days: 7                   # 禁约天数

logging:
  level:
    com.studyroom: info
